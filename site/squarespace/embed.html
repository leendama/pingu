<!-- Pingu waitlist. Generated by site/squarespace/build.mjs from site/index.html,
     style.css, app.js and pingu.svg. Edit those, re-run the script, re-paste. -->
<div id="pingu-waitlist">
<style>
/* This block only loads on the page that carries it. 100vw counts the
   scrollbar, so without the x-clip a full-bleed block adds a horizontal
   scrollbar on any page that scrolls vertically. */
html, body { overflow-x: hidden; }

#pingu-waitlist {
  color-scheme: light dark;
  --chat: #ffffff;
  --bar: rgba(249, 249, 249, 0.94);
  --line: #d9d9de;
  --ink: #000000;
  --ink-2: #8a8a8e;
  --in: #e9e9eb;
  --in-ink: #000000;
  --out: #0a84ff;
  --out-ink: #ffffff;
  --red: #ff3b30;
  --field: #ffffff;
  --col: 460px;
  --gutter: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
#pingu-waitlist {
    --chat: #000000;
    --bar: rgba(28, 28, 30, 0.94);
    --line: #2c2c2e;
    --ink: #ffffff;
    --ink-2: #8d8d93;
    --in: #262628;
    --in-ink: #ffffff;
    --field: #000000;
  }
}

#pingu-waitlist * { box-sizing: border-box; }

#pingu-waitlist,
#pingu-waitlist { height: 100%; }

#pingu-waitlist {
  margin: 0;
  background: var(--chat);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

#pingu-waitlist .phone {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--chat);
}

#pingu-waitlist .bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--bar);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

#pingu-waitlist .avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: block;
}

#pingu-waitlist .name {
  font-size: 11px;
  line-height: 1.2;
  color: var(--ink);
}

#pingu-waitlist .chevron {
  color: var(--ink-2);
  margin-left: 2px;
}

#pingu-waitlist .thread {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 0 12px;
  padding-inline: max(var(--gutter), calc((100% - var(--col)) / 2));
  scroll-behavior: smooth;
}

#pingu-waitlist .thread > * { flex-shrink: 0; }

#pingu-waitlist .thread > :first-child { margin-top: auto; }

#pingu-waitlist .stamp {
  align-self: center;
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
}

#pingu-waitlist .msg {
  max-width: 76%;
  padding: 7px 12px;
  border-radius: 18px;
  font-size: 17px;
  line-height: 1.28;
  overflow-wrap: anywhere;
  animation: pop 180ms ease-out;
}

#pingu-waitlist .msg.in {
  align-self: flex-start;
  background: var(--in);
  color: var(--in-ink);
  border-bottom-left-radius: 4px;
  transform-origin: bottom left;
}

#pingu-waitlist .msg.in.grouped { border-bottom-left-radius: 18px; }

#pingu-waitlist .msg.out {
  align-self: flex-end;
  background: var(--out);
  color: var(--out-ink);
  border-bottom-right-radius: 4px;
  transform-origin: bottom right;
  animation: lift 250ms ease-out;
}

#pingu-waitlist .msg.out.grouped { border-bottom-right-radius: 18px; }

#pingu-waitlist .msg.in + .msg.out,
#pingu-waitlist .msg.out + .msg.in,
#pingu-waitlist .status + .msg.in,
#pingu-waitlist .typing + .msg.out,
#pingu-waitlist .msg.out + .typing { margin-top: 8px; }

#pingu-waitlist .status {
  align-self: flex-end;
  margin: 1px 4px 0;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
}

#pingu-waitlist .status.error { color: var(--red); }

#pingu-waitlist .typing {
  align-self: flex-start;
  display: flex;
  gap: 4px;
  padding: 11px 14px;
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  background: var(--in);
  animation: pop 180ms ease-out;
  transform-origin: bottom left;
}

#pingu-waitlist .typing i {
  display: block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-2);
  animation: bounce 1.2s infinite ease-in-out;
}

#pingu-waitlist .typing i:nth-child(2) { animation-delay: 0.15s; }

#pingu-waitlist .typing i:nth-child(3) { animation-delay: 0.3s; }

#pingu-waitlist .msg.link {
  display: block;
  padding: 0;
  width: 250px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}

#pingu-waitlist .link-art {
  display: grid;
  place-items: center;
  height: 110px;
  background: #24292f;
}

#pingu-waitlist .link-art img { width: 56px; height: 56px; }

#pingu-waitlist .link-meta {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 8px 12px 9px;
}

#pingu-waitlist .link-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
}

#pingu-waitlist .link-host {
  font-size: 13px;
  color: var(--ink-2);
}

#pingu-waitlist .compose {
  position: relative;
  display: flex;
  align-items: center;
  padding: 6px 0 calc(10px + env(safe-area-inset-bottom));
  padding-inline: max(var(--gutter), calc((100% - var(--col)) / 2));
  border-top: 1px solid var(--line);
  background: var(--bar);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

#pingu-waitlist .compose input[type="email"] {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 7px 40px 7px 14px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--field);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
  line-height: 1.25;
  -webkit-appearance: none;
  appearance: none;
}

#pingu-waitlist .compose input::placeholder { color: var(--ink-2); }

#pingu-waitlist .compose input:disabled { opacity: 0.6; }

#pingu-waitlist .compose input:focus-visible,
#pingu-waitlist .send:focus-visible {
  outline: 2px solid var(--out);
  outline-offset: 2px;
}

#pingu-waitlist .send {
  position: absolute;
  right: calc(max(var(--gutter), calc((100% - var(--col)) / 2)) + 5px);
  top: 10px;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--out);
  color: #ffffff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: opacity 120ms ease-out, transform 120ms ease-out;
}

#pingu-waitlist .send:disabled {
  opacity: 0;
  transform: scale(0.6);
  pointer-events: none;
}

#pingu-waitlist .compose.shake { animation: shake 400ms ease-in-out; }

#pingu-waitlist .hp {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

#pingu-waitlist .sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

#pingu-waitlist .noscript {
  padding: 12px 14px;
  font-size: 17px;
  line-height: 1.4;
}

#pingu-waitlist .noscript p { margin: 0 0 8px; }

@keyframes pop {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes lift {
  from { opacity: 0; transform: translateY(24px) scale(0.6); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-4px); opacity: 1; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

@media (prefers-reduced-motion: reduce) {
#pingu-waitlist .thread { scroll-behavior: auto; }

#pingu-waitlist .msg,
#pingu-waitlist .typing,
#pingu-waitlist .typing i,
#pingu-waitlist .compose.shake,
#pingu-waitlist .send { animation: none; transition: none; }
}

/* Last, so it wins over the margin reset the page's own body rule became:
   breaks the block out of Squarespace's centred content column. */
#pingu-waitlist {
  position: relative;
  width: 100vw;
  max-width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  height: 100dvh;
  overflow: hidden;
  text-align: left;
}

<script>
(() => {
  "use strict";

  // Apps Script web app URL, ending in /exec. See apps-script/README.md.
  // Empty string = demo mode: the page animates, nothing is stored.
  const WAITLIST_ENDPOINT = "";

  const REPO_URL = "https://github.com/leendama/pingu";
  const STORAGE_KEY = "pingu-waitlist";

  const SCRIPT = [
    "Pingu, personal assistant on iMessage",
    "Self-hosted, open source",
    "Google Calendar, Gmail, Granola, and others",
    "Other people can text it to book time in your calendar",
    "Reminders, polls, rich links, voice replies, tapbacks",
    "Your email?",
  ];
  const REPLY = "Noot noot, we'll be in touch";
  const RETRY = "Didn't go through, try again";

  const thread = document.getElementById("pingu-thread");
  const form = document.getElementById("pingu-compose");
  const input = document.getElementById("pingu-email");
  const button = document.getElementById("pingu-send");
  const stamp = document.getElementById("pingu-stamp");

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finePointer = window.matchMedia("(pointer: fine)").matches;
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  let typingEl = null;
  let introRunning = false;
  let introAborted = false;

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const wait = (ms) => sleep(reducedMotion ? 0 : ms);

  stamp.textContent = "Today " + new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(new Date());

  function scrollToEnd(instant) {
    thread.scrollTo({ top: thread.scrollHeight, behavior: instant || reducedMotion ? "auto" : "smooth" });
  }

  function groupPrevious(side) {
    const last = thread.lastElementChild;
    if (last && last.classList.contains("msg") && last.classList.contains(side)) last.classList.add("grouped");
  }

  function bubble(side, text) {
    const el = document.createElement("div");
    el.className = "msg " + side;
    el.textContent = text;
    groupPrevious(side);
    thread.appendChild(el);
    scrollToEnd();
    return el;
  }

  function status(text) {
    const el = document.createElement("div");
    el.className = "status";
    el.textContent = text;
    thread.appendChild(el);
    scrollToEnd();
    return el;
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.setAttribute("aria-label", "Pingu is typing");
    typingEl.innerHTML = "<i></i><i></i><i></i>";
    thread.appendChild(typingEl);
    scrollToEnd();
  }

  function hideTyping() {
    if (!typingEl) return;
    typingEl.remove();
    typingEl = null;
  }

  async function pinguSays(text, dwell) {
    showTyping();
    await wait(dwell);
    hideTyping();
    return bubble("in", text);
  }

  function richLink() {
    const el = document.createElement("a");
    el.className = "msg in link";
    el.href = REPO_URL;
    el.target = "_blank";
    el.rel = "noopener";
    el.innerHTML =
      '<span class="link-art"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0Ij4KICA8Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIzMiIgZmlsbD0iIzhlOGU5MyIvPgogIDxlbGxpcHNlIGN4PSIzMiIgY3k9IjQwIiByeD0iMTciIHJ5PSIyMCIgZmlsbD0iIzFjMWMxZSIvPgogIDxlbGxpcHNlIGN4PSIzMiIgY3k9IjQzIiByeD0iMTEiIHJ5PSIxNCIgZmlsbD0iI2YyZjJmNyIvPgogIDxjaXJjbGUgY3g9IjMyIiBjeT0iMjIiIHI9IjEyIiBmaWxsPSIjMWMxYzFlIi8+CiAgPGNpcmNsZSBjeD0iMjcuNSIgY3k9IjIxIiByPSIyLjQiIGZpbGw9IiNmMmYyZjciLz4KICA8Y2lyY2xlIGN4PSIzNi41IiBjeT0iMjEiIHI9IjIuNCIgZmlsbD0iI2YyZjJmNyIvPgogIDxjaXJjbGUgY3g9IjI4IiBjeT0iMjEuNCIgcj0iMS4xIiBmaWxsPSIjMWMxYzFlIi8+CiAgPGNpcmNsZSBjeD0iMzciIGN5PSIyMS40IiByPSIxLjEiIGZpbGw9IiMxYzFjMWUiLz4KICA8cGF0aCBkPSJNMjggMjYuNWg4bC00IDQuNXoiIGZpbGw9IiNmZjlmMGEiLz4KICA8cGF0aCBkPSJNMTUgMzRjLTQgNC00IDE0IDEgMjAgMi02IDItMTMtMS0yMHoiIGZpbGw9IiMxYzFjMWUiLz4KICA8cGF0aCBkPSJNNDkgMzRjNCA0IDQgMTQtMSAyMC0yLTYtMi0xMyAxLTIweiIgZmlsbD0iIzFjMWMxZSIvPgogIDxwYXRoIGQ9Ik0yNSA2MGg2bC0yLTR6TTMzIDYwaDZsLTItNHoiIGZpbGw9IiNmZjlmMGEiLz4KPC9zdmc+Cg==" alt="" width="56" height="56"></span>' +
      '<span class="link-meta"><span class="link-title">leendama/pingu</span><span class="link-host">github.com</span></span>';
    groupPrevious("in");
    thread.appendChild(el);
    scrollToEnd();
    return el;
  }

  function setComposeEnabled(enabled) {
    input.disabled = !enabled;
    button.disabled = !enabled || input.value.trim() === "";
  }

  function shake() {
    form.classList.remove("shake");
    void form.offsetWidth;
    form.classList.add("shake");
  }

  function persist(email) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ email, at: new Date().toISOString() }));
    } catch (_) {
      // Storage unavailable. The thread still completed.
    }
  }

  function restored() {
    const params = new URLSearchParams(location.search);
    if (params.get("preview") === "done") return "you@example.com";
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      return saved && typeof saved.email === "string" ? saved.email : null;
    } catch (_) {
      return null;
    }
  }

  async function submit(email, honeypot) {
    if (!WAITLIST_ENDPOINT) {
      console.warn("Pingu waitlist: WAITLIST_ENDPOINT is empty. Demo mode, nothing stored.");
      await sleep(500);
      return true;
    }
    // text/plain keeps this a simple request: no CORS preflight, which Apps Script cannot answer.
    const response = await fetch(WAITLIST_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ email, website: honeypot, referrer: document.referrer, ua: navigator.userAgent }),
    });
    if (!response.ok) return false;
    const data = await response.json().catch(() => null);
    return Boolean(data && data.ok);
  }

  async function intro() {
    introRunning = true;
    await wait(400);
    for (const line of SCRIPT) {
      if (introAborted) break;
      await pinguSays(line, 700);
      await wait(200);
    }
    introRunning = false;
    if (!introAborted && finePointer) input.focus({ preventScroll: true });
  }

  function renderDone(email) {
    for (const line of SCRIPT) bubble("in", line);
    bubble("out", email);
    status("Delivered");
    bubble("in", REPLY);
    richLink();
    setComposeEnabled(false);
    scrollToEnd(true);
  }

  input.addEventListener("input", () => {
    button.disabled = input.value.trim() === "";
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = input.value.trim().toLowerCase();
    if (!EMAIL.test(email)) {
      shake();
      input.focus({ preventScroll: true });
      return;
    }
    if (introRunning) {
      introAborted = true;
      hideTyping();
    }
    const honeypot = form.elements.website.value;

    setComposeEnabled(false);
    input.value = "";
    bubble("out", email);

    let ok = false;
    const request = submit(email, honeypot).catch(() => false);
    await wait(600);
    ok = await request;

    if (ok) {
      status("Delivered");
      await pinguSays(REPLY, 800);
      await wait(500);
      richLink();
      persist(email);
      return;
    }

    const label = status("Not Delivered");
    label.classList.add("error");
    await pinguSays(RETRY, 800);
    input.value = email;
    setComposeEnabled(true);
    if (finePointer) input.focus({ preventScroll: true });
  });

  const saved = restored();
  if (saved) {
    renderDone(saved);
  } else {
    setComposeEnabled(true);
    intro();
  }
})();

</script>
